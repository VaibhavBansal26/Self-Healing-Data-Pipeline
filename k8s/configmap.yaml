apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-pipeline-config
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RAW_TOPIC: raw_orders
  DLQ_TOPIC: dead_letter_events
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: pipeline_db
  POSTGRES_USER: postgres
  MCP_CLIENT_MODE: local
  ENABLE_PROMETHEUS_SERVER: "true"
  METRICS_PORT: "9108"

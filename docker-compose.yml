services:
  postgres:
    image: postgres:16
    container_name: healing_postgres
    environment:
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: healing_redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: healing_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: healing_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: healing_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  airflow-postgres:
    image: postgres:16
    container_name: healing_airflow_postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "55433:5432"

  airflow-init:
    image: apache/airflow:2.10.4
    container_name: healing_airflow_init
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Vaibhav --lastname Bansal --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.10.4
    container_name: healing_airflow_webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.4
    container_name: healing_airflow_scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: scheduler


  data-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: self-healing-app:latest
    container_name: healing_data_api
    depends_on:
      - postgres
      - redis
      - kafka
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_CLIENT_MODE: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_LLM: ${ENABLE_LLM:-true}
      ENABLE_DOCKER_STATUS: ${ENABLE_DOCKER_STATUS:-true}
      ENABLE_DOCKER_RECOVERY: ${ENABLE_DOCKER_RECOVERY:-true}
      AUTO_HEAL_PIPELINE_STEPS: ${AUTO_HEAL_PIPELINE_STEPS:-true}
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: self-healing-frontend:latest
    container_name: healing_frontend
    depends_on:
      - data-api
    ports:
      - "3000:3000"

  metrics:
    image: self-healing-app:latest
    container_name: healing_metrics
    working_dir: /app
    environment:
      METRICS_PORT: 9108
      ENABLE_DOCKER_STATUS: ${ENABLE_DOCKER_STATUS:-true}
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "9108:9108"
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m src.observability_api

  auto-healer:
    image: self-healing-app:latest
    container_name: healing_auto_healer
    depends_on:
      - data-api
      - postgres
      - redis
      - kafka
    working_dir: /app
    environment:
      AUTO_HEAL_API_BASE_URL: http://data-api:8000
      AUTO_HEAL_PIPELINE_STEPS: ${AUTO_HEAL_PIPELINE_STEPS:-true}
      AUTO_HEAL_INTERVAL_SECONDS: ${AUTO_HEAL_INTERVAL_SECONDS:-8}
      AUTO_HEAL_DEMO_DELAY_SECONDS: ${AUTO_HEAL_DEMO_DELAY_SECONDS:-0}
      AUTO_HEAL_VISIBILITY_HOLD_SECONDS: ${AUTO_HEAL_VISIBILITY_HOLD_SECONDS:-90}
      ENABLE_DOCKER_STATUS: ${ENABLE_DOCKER_STATUS:-true}
      ENABLE_DOCKER_RECOVERY: ${ENABLE_DOCKER_RECOVERY:-true}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m src.auto_healer_loop

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: healing_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

  consumer:
    image: self-healing-app:latest
    container_name: healing_consumer
    depends_on:
      - postgres
      - redis
      - kafka
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_CLIENT_MODE: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_LLM: ${ENABLE_LLM:-true}
      ENABLE_PROMETHEUS_SERVER: "true"
      METRICS_PORT: 9108
    ports:
      - "9109:9108"
    volumes:
      - ./:/app
    command: python -m src.consumer
